services:
  pve-fleet:
    build: .
    image: pve-fleet:latest
    container_name: pve-fleet
    restart: unless-stopped
    # host network: needed for Wake-on-LAN to standalone nodes, and so that a browser
    # on the Pi itself is recognised as 'localhost'. The dashboard listens on port 8080 (http)
    # and, once there is a certificate (Certificates), on 8443 (https).
    network_mode: host
    volumes:
      - ./data:/data          # config.yml (and state.json) live here
    environment:
      - TZ=Europe/Amsterdam
      # - DEMO=1              # force demo mode with sample data
      # - LOG_LEVEL=DEBUG
