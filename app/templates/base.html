<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12161A">
<title>{% block title %}PVE Fleet{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ version }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23E8A13A' stroke-width='2'%3E%3Crect x='3' y='4' width='18' height='6' rx='1.5'/%3E%3Crect x='3' y='14' width='18' height='6' rx='1.5'/%3E%3C/svg%3E">
<script>window.PF_POLL_MS = {{ poll_ms }};</script>
<script src="{{ url_for('static', filename='js/common.js') }}?v={{ version }}"></script>
<script src="{{ url_for('static', filename='js/actions.js') }}?v={{ version }}"></script>
{% block head %}{% endblock %}
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8A13A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1.5"></rect><rect x="3" y="14" width="18" height="6" rx="1.5"></rect><path d="M7 7h.01M7 17h.01"></path></svg>
    <span>PVE Fleet</span>
  </a>
  <nav class="crumbs" aria-label="Kruimelpad" id="crumbs">{% block crumbs %}{% endblock %}</nav>
  <div class="right">
    {% if demo %}<span class="badge-demo" title="Er is geen config.yml gevonden of demo staat aan">Demomodus · voorbeelddata</span>{% endif %}
    <span class="live" id="live"><span class="pulse" aria-hidden="true"></span><span class="txt">Laden…</span></span>
    <a class="btn ghost" href="/kiosk">Kiosk</a>
    {% if user %}
    <details class="usermenu">
      <summary class="btn ghost" aria-label="Menu voor {{ user }}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>{{ user }}
      </summary>
      <div class="menu">
        <a href="/settings">Instellingen</a>
        <a href="/servers">Servers &amp; verbinding</a>
        <a href="/logout">Uitloggen</a>
      </div>
    </details>
    {% endif %}
  </div>
</header>
{% block body %}{% endblock %}
<div class="footer">PVE Fleet v{{ version }}</div>
</body>
</html>
