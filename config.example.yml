# PVE Fleet — copy to data/config.yml and fill in your own servers.
# Without data/config.yml the dashboard starts in demo mode.

demo: false

# Seconds between rounds across all servers (minimum 3).
poll_interval: 10

# How often (seconds) each node is checked for available package updates.
updates_interval: 1800

# Broadcast address for Wake-on-LAN packets the dashboard sends itself.
wol_broadcast: 255.255.255.255

# Updates in containers (Updates › Updates in VMs & containers): how often to check (hours).
# guest_updates_hours: 6
# GitHub token (without permissions) if you compare more than ~60 apps per hour.
# github_token: "ghp_..."

# Thresholds for alerts (percentages).
thresholds:
  ram_warn: 80
  ram_crit: 90
  cpu_warn: 90
  storage_warn: 80
  storage_crit: 90

servers:
  # A cluster: one token is enough. Put several nodes under 'hosts';
  # if the first one drops out, the dashboard uses the next.
  - name: cluster-home
    hosts: [192.168.1.11, 192.168.1.12, 192.168.1.13]
    token_id: "dashboard@pve!fleet"
    token_secret: "00000000-0000-0000-0000-000000000000"
    verify_ssl: false        # true if you have a valid certificate
    # Wake-on-LAN: Proxmox wakes cluster nodes itself if the MAC address is set on the node
    # (pvenode config set -wakeonlan <MAC>). Prefer the dashboard itself? Put them here:
    # wol: { pve-01: "AA:BB:CC:DD:EE:01", pve-02: "AA:BB:CC:DD:EE:02" }

  # A standalone node.
  - name: pve-garage
    host: 192.168.1.40
    token_id: "dashboard@pve!fleet"
    token_secret: "00000000-0000-0000-0000-000000000000"
    verify_ssl: false
    # port: 8006
    # Wake-on-LAN for this standalone node (MAC address of the network card):
    # wol_mac: "AA:BB:CC:DD:EE:FF"
