# PVE Fleet — kopieer naar data/config.yml en vul je eigen servers in.
# Zonder data/config.yml start het dashboard in demomodus.

demo: false

# Seconden tussen rondes langs alle servers (minimaal 3).
poll_interval: 10

# Hoe vaak (seconden) per node naar beschikbare pakketupdates wordt gekeken.
updates_interval: 1800

# Broadcastadres voor Wake-on-LAN-pakketten die het dashboard zelf verstuurt.
wol_broadcast: 255.255.255.255

# Updates in containers (Updates › Updates in VM's & containers): hoe vaak kijken (uren).
# guest_updates_hours: 6
# GitHub-token (zonder rechten) als je meer dan ~60 apps laat vergelijken per uur.
# github_token: "ghp_..."

# Drempels voor alerts (procenten).
thresholds:
  ram_warn: 80
  ram_crit: 90
  cpu_warn: 90
  storage_warn: 80
  storage_crit: 90

servers:
  # Een cluster: één token is genoeg. Zet meerdere nodes onder 'hosts';
  # valt de eerste weg, dan gebruikt het dashboard de volgende.
  - name: cluster-home
    hosts: [192.168.1.11, 192.168.1.12, 192.168.1.13]
    token_id: "dashboard@pve!fleet"
    token_secret: "00000000-0000-0000-0000-000000000000"
    verify_ssl: false        # true als je een geldig certificaat hebt
    # Wake-on-LAN: Proxmox wekt clusternodes zelf als het MAC-adres op de node is ingesteld
    # (pvenode config set -wakeonlan <MAC>). Liever via het dashboard zelf? Zet ze hier:
    # wol: { pve-01: "AA:BB:CC:DD:EE:01", pve-02: "AA:BB:CC:DD:EE:02" }

  # Een losse node.
  - name: pve-garage
    host: 192.168.1.40
    token_id: "dashboard@pve!fleet"
    token_secret: "00000000-0000-0000-0000-000000000000"
    verify_ssl: false
    # port: 8006
    # Wake-on-LAN voor deze losse node (MAC-adres van de netwerkkaart):
    # wol_mac: "AA:BB:CC:DD:EE:FF"
